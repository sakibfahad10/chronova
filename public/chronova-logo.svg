<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Watch Strap Top -->
  <rect x="130" y="10" width="40" height="40" rx="8" fill="url(#grad1)" />

  <!-- Watch Body -->
  <circle cx="150" cy="150" r="80" fill="white" stroke="url(#grad1)" stroke-width="8" />

  <!-- Watch Strap Bottom -->
  <rect x="130" y="250" width="40" height="40" rx="8" fill="url(#grad1)" />

  <!-- Watch Crown -->
  <rect x="228" y="135" width="10" height="30" rx="3" fill="#00d4ff" />

  <!-- Chronova Text Inside the Watch -->
  <text x="150" y="160" font-family="Segoe UI, sans-serif" font-size="22" text-anchor="middle" fill="#00bcd4" style="letter-spacing:1px;">
    Chronova
  </text>

  <!-- Hour & Minute Hands -->
  <line x1="150" y1="150" x2="150" y2="110" stroke="#00bcd4" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="150" x2="180" y2="150" stroke="#4facfe" stroke-width="3" stroke-linecap="round" />
</svg>
